# Serves the Vite-built SPA. Two things matter here beyond the default
# nginx static-file config:
#
# 1. SPA fallback (`try_files ... /index.html`) — React Router owns
#    client-side routing; a hard refresh on e.g. /app/documents must not
#    404 at the web server before React Router ever sees the URL.
# 2. Long-cache immutable assets (Vite's content-hashed filenames in
#    /assets/) vs. never-cache index.html (so a new deploy is picked up
#    on next load instead of being served stale from cache).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
