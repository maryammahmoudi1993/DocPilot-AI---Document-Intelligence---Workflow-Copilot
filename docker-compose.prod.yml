# Production-parity Compose file — see docs/DEPLOYMENT.md for the full
# runbook (required env vars, the release/migration step, rollback).
# Not a real cloud deployment manifest (no cloud provider is targeted by
# this portfolio project — see docs/DEPLOYMENT.md for why), but every
# service here matches what a real deployment needs: a gunicorn web
# process, a separate worker process, nginx serving the static frontend
# build, and no dev-only conveniences (bind-mounted source, DEBUG=True,
# insecure default secrets) baked in.
#
# Object storage: MinIO is included below so this file is runnable
# standalone for a deployment dry run. A real deployment points
# DOCUMENT_STORAGE_ENDPOINT_URL at real S3 (or another S3-compatible
# provider) instead and drops the minio/minio-init services entirely —
# see apps/documents/storage.py and docs/adr/0004-storage-abstraction.md.
#
# Every value below is meant to come from a real `.env` (not the
# development defaults docker-compose.yml falls back to) — see
# docs/DEPLOYMENT.md's required-variables table. There are
# intentionally no defaults for secrets here; an unset required
# variable should fail loudly (empty string), not silently run insecure.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DOCUMENT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${DOCUMENT_STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${DOCUMENT_STORAGE_ACCESS_KEY} ${DOCUMENT_STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/${DOCUMENT_STORAGE_BUCKET}
      "

  # The release step (migrate) is deliberately NOT part of this
  # service's command — see backend/Dockerfile.prod and
  # docs/DEPLOYMENT.md's "release step" section. Run it once,
  # explicitly, before (re)starting `backend`/`celery-worker` on a new
  # image tag: `docker compose -f docker-compose.prod.yml run --rm
  # backend python manage.py migrate --noinput`.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_ENDPOINT_URL: ${DOCUMENT_STORAGE_ENDPOINT_URL:-http://minio:9000}
      DOCUMENT_STORAGE_PUBLIC_ENDPOINT_URL: ${DOCUMENT_STORAGE_PUBLIC_ENDPOINT_URL}
      DOCUMENT_STORAGE_ACCESS_KEY: ${DOCUMENT_STORAGE_ACCESS_KEY}
      DOCUMENT_STORAGE_SECRET_KEY: ${DOCUMENT_STORAGE_SECRET_KEY}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DOCUMENT_OCR_PROVIDER: ${DOCUMENT_OCR_PROVIDER:-tesseract}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A config worker --loglevel=info
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
