[project]
name = "docpilot-backend"
version = "0.1.0"
description = "DocPilot AI backend — Django/DRF modular monolith."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Runtime dependencies. Every entry is pinned to an exact version for
# reproducible installs (see docs' repository-audit note on dependency
# management — no lockfile tool such as Poetry/PDM is introduced because
# exact pins already give reproducibility without adding another tool).
dependencies = [
  # Web framework and API layer.
  "Django==5.2.17",
  "djangorestframework==3.17.2",
  # OpenAPI schema generation (required tooling per project tech direction).
  "drf-spectacular==0.30.0",
  # Typed environment-variable parsing (DATABASE_URL, REDIS_URL, SENTRY_DSN, ...)
  # so settings stay environment-based without hand-rolled os.environ parsing.
  "django-environ==0.14.0",
  # PostgreSQL driver (psycopg 3). Binary extra avoids requiring local
  # PostgreSQL headers/build toolchain for development.
  "psycopg[binary]==3.3.4",
  # Redis client — used by the readiness check now, and will become the
  # Celery broker/result-backend client in the async-processing phase.
  "redis==8.1.0",
  # Sentry error reporting. Required by the project's infrastructure
  # direction ("Sentry-ready error reporting"). No-op at runtime unless
  # SENTRY_DSN is set, so it is safe to wire in now.
  "sentry-sdk==2.66.1",
  # JWT authentication (access + refresh) for the SPA frontend, including
  # refresh-token blacklisting on logout (token_blacklist app).
  "djangorestframework-simplejwt==5.5.1",
  # CORS: the frontend (a different origin in dev — localhost:3000 vs
  # localhost:8000) needs explicit permission to send/receive the
  # httpOnly refresh-token cookie cross-origin.
  "django-cors-headers==4.9.0",
  # S3-compatible object storage client (MinIO locally, S3 in
  # deployment) — the storage abstraction's only concrete backend.
  "boto3==1.43.66",
  # Declarative filtering/ordering for the document list endpoint
  # (status/content-type filters, filename search, sort by
  # created_at/size/filename) instead of hand-rolled queryset branching.
  "django-filter==26.1",
  # Async task queue for the document-processing pipeline (Phase 4) —
  # required tech direction ("Redis and Celery").
  "celery==5.6.3",
  # Digital-PDF text extraction, corrupt/encrypted-file detection, and
  # (in tests) generating small valid PDF fixtures — one library covers
  # all three instead of a separate PDF-writing dependency.
  "pypdf==6.15.0",
  # Real OCR provider (apps/processing/providers.py) — only imported
  # when DOCUMENT_OCR_PROVIDER=tesseract; requires the system
  # tesseract-ocr binary (see Dockerfile). The "mock" provider (default
  # everywhere except Docker Compose local dev) needs neither this nor
  # pdf2image/Pillow below, but they're still installed unconditionally
  # for simplicity — none of them do anything unless imported.
  "pytesseract==0.3.13",
  # Renders PDF pages to images for the OCR provider — requires the
  # system poppler-utils binary (see Dockerfile).
  "pdf2image==1.17.0",
  "Pillow==12.3.0",
  # pgvector column type + queryset helpers (VectorField, L2/cosine
  # distance lookups) for Phase 6's semantic-search chunk index —
  # required tech direction ("PostgreSQL with pgvector").
  "pgvector==0.5.0",
  # Fernet symmetric encryption for webhook secrets at rest (Phase 8) —
  # already a transitive dependency (djangorestframework-simplejwt),
  # pinned and imported directly now that apps.notifications.crypto
  # depends on it explicitly.
  "cryptography==50.0.0",
  # Production WSGI server (Phase 11) — `manage.py runserver` (used
  # everywhere else in this project — local dev, CI, docker-compose.yml)
  # is explicitly documented by Django as unfit for production.
  "gunicorn==26.0.0",
  # Real classification/extraction provider (apps/processing/providers.py,
  # apps/extraction/providers.py via common/gemini.py) — only called
  # when DOCUMENT_CLASSIFICATION_PROVIDER or DOCUMENT_EXTRACTION_PROVIDER
  # is "gemini" (requires GEMINI_API_KEY); the deterministic defaults
  # need neither this package nor a network call, same "installed
  # unconditionally, does nothing unless imported" posture as the OCR
  # dependencies above.
  "google-genai==2.18.1",
]

[tool.setuptools.packages.find]
# Explicit include: this "package" is really just the app's own source
# tree (apps/, common/, config/), not a distributable library — without
# this, setuptools' automatic flat-layout discovery refuses to guess
# which of several top-level directories (apps, common, config, tests)
# is "the" package.
include = ["apps*", "common*", "config*"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.13.0",
  "pytest-cov==7.1.0",
  "factory_boy==3.3.3",
  "ruff==0.16.1",
  "mypy==2.3.0",
  "django-stubs==6.0.7",
  "djangorestframework-stubs==3.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# django-environ ships no type stubs / py.typed marker.
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore and django-filter ship no type stubs / py.typed marker.
module = ["boto3.*", "botocore.*", "django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery, pytesseract, and pdf2image ship no type stubs / py.typed
# marker either (see apps/processing/).
module = ["celery.*", "pytesseract.*", "pdf2image.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["apps", "common", "config"]
omit = ["*/migrations/*", "*/tests/*"]
